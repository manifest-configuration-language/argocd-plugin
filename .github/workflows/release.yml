name: Release
run-name: Release next ${{ inputs.bump }} (${{ inputs.channel }})

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "バージョンの上げ幅"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      channel:
        description: "公開チャネル"
        required: true
        default: stable
        type: choice
        options:
          - stable
          - rc

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      release_tag: ${{ steps.target.outputs.release_tag }}
      version: ${{ steps.target.outputs.version }}
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@v5.2.6
        with:
          install: true
          install_args: go
          cache: false

      - name: Validate release branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            printf 'Release workflow must run from the default branch (%s).\n' \
              "$DEFAULT_BRANCH" >&2
            exit 1
          fi
          default_branch_sha="$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/$DEFAULT_BRANCH" \
            --jq '.object.sha')"
          if [[ "$GITHUB_SHA" != "$default_branch_sha" ]]; then
            printf 'Release workflow SHA %s is not the current %s tip (%s).\n' \
              "$GITHUB_SHA" "$DEFAULT_BRANCH" "$default_branch_sha" >&2
            exit 1
          fi

      - name: Wait for CI and Argo CD integration checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for workflow in ci.yml argo-integration.yml; do
            timeout=120
            deadline=$((SECONDS + timeout))
            run_id=""
            while [[ -z "$run_id" ]]; do
              run_id="$(gh run list \
                --workflow "$workflow" \
                --branch "$GITHUB_REF_NAME" \
                --event push \
                --commit "$GITHUB_SHA" \
                --limit 1 \
                --json databaseId \
                --jq '.[0].databaseId // empty' 2>/dev/null || true)"
              if [[ -n "$run_id" ]]; then
                break
              fi
              if (( SECONDS >= deadline )); then
                printf 'Timed out after %ss waiting for %s at %s.\n' \
                  "$timeout" "$workflow" "$GITHUB_SHA" >&2
                exit 1
              fi
              sleep 5
            done
            gh run watch "$run_id" --exit-status --compact
          done

      - name: Determine release version
        id: target
        env:
          BUMP: ${{ inputs.bump }}
          CHANNEL: ${{ inputs.channel }}
          GITHUB_SHA: ${{ github.sha }}
        run: go run ./cmd/release-version

  publish:
    needs: prepare
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.6
        with:
          install: true
          install_args: go
          cache: false
      - uses: docker/setup-buildx-action@v3.12.0
      - uses: docker/login-action@v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5.10.0
        with:
          images: ghcr.io/manifest-configuration-language/argocd-plugin
          tags: |
            type=raw,value=${{ needs.prepare.outputs.release_tag }}
            type=sha
      - uses: docker/build-push-action@v6.19.2
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@v3.9.1
      - name: Sign container image
        env:
          IMAGE: ghcr.io/manifest-configuration-language/argocd-plugin
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - uses: actions/attest-build-provenance@v2.4.0
        with:
          subject-name: ghcr.io/manifest-configuration-language/argocd-plugin
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    needs: [prepare, publish]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          if existing_release=$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease' 2>/dev/null); then
            expected_prerelease=false
            if [[ "$RELEASE_CHANNEL" == rc ]]; then
              expected_prerelease=true
            fi
            if [[ "$existing_release" != "$expected_prerelease" ]]; then
              printf 'Release %s already exists with prerelease=%s, expected %s.\n' \
                "$RELEASE_TAG" "$existing_release" "$expected_prerelease" >&2
              exit 1
            fi
            printf 'Release %s already exists; skipping duplicate creation.\n' "$RELEASE_TAG"
            exit 0
          fi
          args=("$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$RELEASE_VERSION" --generate-notes)
          if [[ "$RELEASE_CHANNEL" == rc ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
