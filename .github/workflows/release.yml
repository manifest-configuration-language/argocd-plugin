name: Release
run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version tag
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      release_tag: ${{ steps.target.outputs.release_tag }}
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release request
        id: target
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            printf 'Release workflow must run from the default branch (%s).\n' \
              "$DEFAULT_BRANCH" >&2
            exit 1
          fi
          default_branch_sha="$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/$DEFAULT_BRANCH" \
            --jq '.object.sha')"
          if [[ "$GITHUB_SHA" != "$default_branch_sha" ]]; then
            printf 'Release workflow SHA %s is not the current %s tip (%s).\n' \
              "$GITHUB_SHA" "$DEFAULT_BRANCH" "$default_branch_sha" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'Release version must use stable vX.Y.Z format: %s\n' \
              "$RELEASE_VERSION" >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$RELEASE_VERSION"; then
            printf 'Tag %s already exists; refusing to reuse it.\n' \
              "$RELEASE_VERSION" >&2
            exit 1
          fi
          latest="$(git tag --list 'v*' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
            sort -V | tail -n 1 || true)"
          if [[ -n "$latest" ]] && \
             [[ "$(printf '%s\n%s\n' "$latest" "$RELEASE_VERSION" |
               sort -V | tail -n 1)" != "$RELEASE_VERSION" ]]; then
            printf 'Release version %s must be newer than the latest release %s.\n' \
              "$RELEASE_VERSION" "$latest" >&2
            exit 1
          fi
          echo "release_tag=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Wait for CI and Argo CD integration checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for workflow in ci.yml argo-integration.yml; do
            timeout=120
            deadline=$((SECONDS + timeout))
            run_id=""
            while [[ -z "$run_id" ]]; do
              run_id="$(gh run list \
                --workflow "$workflow" \
                --branch "$GITHUB_REF_NAME" \
                --event push \
                --commit "$GITHUB_SHA" \
                --limit 1 \
                --json databaseId \
                --jq '.[0].databaseId // empty' 2>/dev/null || true)"
              if [[ -n "$run_id" ]]; then
                break
              fi
              if (( SECONDS >= deadline )); then
                printf 'Timed out after %ss waiting for %s at %s.\n' \
                  "$timeout" "$workflow" "$GITHUB_SHA" >&2
                exit 1
              fi
              sleep 5
            done
            gh run watch "$run_id" --exit-status --compact
          done

  publish:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - mcl-version: ''
            legacy-sdk: 'false'
          - mcl-version: compat/mcl-v0.4.7/go.mod
            legacy-sdk: 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.6
        with:
          install: true
          install_args: go
          cache: false
      - id: sdk
        env:
          SDK_VERSION_FILE: ${{ matrix.mcl-version }}
        run: |
          if [ -z "$SDK_VERSION_FILE" ]; then
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "tag_suffix=" >> "$GITHUB_OUTPUT"
          else
            version=$(go list -modfile="$SDK_VERSION_FILE" -m -f '{{.Version}}' github.com/manifest-configuration-language/mcl)
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "tag_suffix=-mcl-$version" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@v3.7.0
      - uses: docker/setup-buildx-action@v3.12.0
      - uses: docker/login-action@v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5.10.0
        with:
          images: ghcr.io/manifest-configuration-language/argocd-plugin
          tags: |
            type=raw,value=${{ needs.prepare.outputs.release_tag }}${{ steps.sdk.outputs.tag_suffix }}
            type=sha,suffix=${{ steps.sdk.outputs.tag_suffix }}
      - uses: docker/build-push-action@v6.19.2
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            MCL_SDK_VERSION=${{ steps.sdk.outputs.version }}
            MCL_PLUGIN_VERSION=${{ steps.sdk.outputs.version }}
            MCL_LEGACY_SDK=${{ matrix.legacy-sdk }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@v3.9.1
      - name: Sign container image
        env:
          IMAGE: ghcr.io/manifest-configuration-language/argocd-plugin
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - uses: actions/attest-build-provenance@v2.4.0
        with:
          subject-name: ghcr.io/manifest-configuration-language/argocd-plugin
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    needs: [prepare, publish]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes
