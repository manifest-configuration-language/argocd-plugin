name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release
  cancel-in-progress: false
  queue: max

permissions: {}

jobs:
  publish:
    strategy:
      matrix:
        include:
          - mcl-version: ''
            legacy-sdk: 'false'
          - mcl-version: compat/mcl-v0.4.7/go.mod
            legacy-sdk: 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.6
        with:
          install: true
          install_args: go
          cache: false
      - id: sdk
        env:
          SDK_VERSION_FILE: ${{ matrix.mcl-version }}
        run: |
          if [ -z "$SDK_VERSION_FILE" ]; then
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "tag_suffix=" >> "$GITHUB_OUTPUT"
          else
            version=$(go list -modfile="$SDK_VERSION_FILE" -m -f '{{.Version}}' github.com/manifest-configuration-language/mcl)
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "tag_suffix=-mcl-$version" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@v3.7.0
      - uses: docker/setup-buildx-action@v3.12.0
      - uses: docker/login-action@v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5.10.0
        with:
          images: ghcr.io/manifest-configuration-language/argocd-plugin
          tags: |
            type=raw,value=${{ github.ref_name }}${{ steps.sdk.outputs.tag_suffix }}
            type=sha,suffix=${{ steps.sdk.outputs.tag_suffix }}
      - uses: docker/build-push-action@v6.19.2
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            MCL_SDK_VERSION=${{ steps.sdk.outputs.version }}
            MCL_PLUGIN_VERSION=${{ steps.sdk.outputs.version }}
            MCL_LEGACY_SDK=${{ matrix.legacy-sdk }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@v3.9.1
      - name: Sign container image
        env:
          IMAGE: ghcr.io/manifest-configuration-language/argocd-plugin
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - uses: actions/attest-build-provenance@v2.4.0
        with:
          subject-name: ghcr.io/manifest-configuration-language/argocd-plugin
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
