name: Argo CD integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cmp:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      E2E_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - uses: helm/kind-action@v1.14.0
        with:
          cluster_name: mcl-argocd-e2e
      - uses: docker/setup-buildx-action@v3.12.0
      - uses: docker/build-push-action@v6.19.2
        with:
          context: .
          platforms: linux/amd64
          tags: mcl-argocd:e2e
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: kind load docker-image mcl-argocd:e2e --name mcl-argocd-e2e
      - run: bash scripts/argo-integration.sh
