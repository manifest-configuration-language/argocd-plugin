name: Argo CD integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: integration-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cmp:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      E2E_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      E2E_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      MCL_PLUGIN_IMAGE: mcl-argocd:e2e
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5.5.0
        with:
          go-version-file: go.mod
      - uses: azure/setup-kubectl@v4.0.0
        with:
          version: v1.32.0
      - name: Create kind cluster
        run: go tool kind create cluster --name mcl-argocd-e2e --image kindest/node:v1.32.0@sha256:c48c62eac5da28cdadcf560d1d8616cfa6783b58f0d94cf63ad1bf49600cb027 --wait 5m
      - uses: docker/setup-buildx-action@v3.12.0
      - uses: docker/build-push-action@v6.19.2
        with:
          context: .
          platforms: linux/amd64
          tags: ${{ env.MCL_PLUGIN_IMAGE }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Load plugin image into kind
        run: go tool kind load docker-image "$MCL_PLUGIN_IMAGE" --name mcl-argocd-e2e
      - name: Build and load authenticated Git fixture
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --target git-e2e-server \
            --tag mcl-git-e2e-server:e2e --load .
          go tool kind load docker-image mcl-git-e2e-server:e2e --name mcl-argocd-e2e
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$RUNNER_TEMP/git-test.key" -out "$RUNNER_TEMP/git-test.crt" \
            -subj "/CN=mcl-git-auth.argocd.svc.cluster.local" \
            -addext "subjectAltName=DNS:mcl-git-auth.argocd.svc.cluster.local,IP:127.0.0.1"
          kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret tls mcl-git-auth-tls -n argocd \
            --cert="$RUNNER_TEMP/git-test.crt" --key="$RUNNER_TEMP/git-test.key"
          kubectl apply -n argocd -f - <<'EOF'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: mcl-git-auth
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: mcl-git-auth
            template:
              metadata:
                labels:
                  app: mcl-git-auth
              spec:
                containers:
                  - name: git
                    image: mcl-git-e2e-server:e2e
                    imagePullPolicy: IfNotPresent
                    env:
                      - name: GIT_TEST_ADMIN_TOKEN
                        value: e2e-admin-token
                      - name: GIT_TEST_APPLICATION_PASSWORD
                        value: e2e-application-password
                      - name: GIT_TEST_PRIVATE_PASSWORD
                        value: e2e-private-password
                    ports:
                      - name: https
                        containerPort: 8443
                    volumeMounts:
                      - name: tls
                        mountPath: /tls
                        readOnly: true
                volumes:
                  - name: tls
                    secret:
                      secretName: mcl-git-auth-tls
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: mcl-git-auth
          spec:
            selector:
              app: mcl-git-auth
            clusterIP: 10.96.0.123
            ports:
              - name: https
                port: 8443
                targetPort: https
          EOF
          kubectl rollout status -n argocd deployment/mcl-git-auth --timeout=2m
      - name: Install Argo CD and the MCL plugin
        run: |
          set -euo pipefail
          kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply --server-side --force-conflicts -n argocd \
            -f https://raw.githubusercontent.com/argoproj/argo-cd/v3.6.1/manifests/install.yaml
          kubectl wait -n argocd --for=condition=Available deployment/argocd-repo-server --timeout=5m
          kubectl create configmap argocd-tls-certs-cm -n argocd \
            --from-file=mcl-git-auth.argocd.svc.cluster.local="$RUNNER_TEMP/git-test.crt" \
            --dry-run=client -o yaml | kubectl apply -f -
          patch_file="$(mktemp)"
          trap 'rm -f "$patch_file"' EXIT
          sed "s#ghcr.io/manifest-configuration-language/argocd-plugin:v0.1.1#$MCL_PLUGIN_IMAGE#" \
            examples/install/kustomize/argocd-repo-server-patch.yaml > "$patch_file"
          kubectl patch -n argocd deployment/argocd-repo-server \
            --type=strategic --patch-file "$patch_file"
          sed 's/provideGitCreds: false/provideGitCreds: true/' plugin/plugin.yaml > plugin-e2e.yaml
          kubectl create configmap mcl-plugin-config -n argocd \
            --from-file=plugin.yaml=plugin-e2e.yaml
          kubectl patch -n argocd deployment/argocd-repo-server --type=strategic --patch '
          spec:
            template:
              spec:
                securityContext:
                  fsGroup: 999
                volumes:
                  - name: mcl-plugin-config
                    configMap:
                      name: mcl-plugin-config
                  - name: mcl-askpass
                    emptyDir: {}
                  - name: mcl-git-auth-tls
                    secret:
                      secretName: mcl-git-auth-tls
                containers:
                  - name: argocd-repo-server
                    env:
                      - name: ARGOCD_ASK_PASS_SOCK
                        value: /var/run/mcl-askpass/argocd-git-ask-pass.sock
                    volumeMounts:
                      - name: mcl-askpass
                        mountPath: /var/run/mcl-askpass
                  - name: mcl
                    env:
                      - name: ARGOCD_ASK_PASS_SOCK
                        value: /var/run/mcl-askpass/argocd-git-ask-pass.sock
                      - name: MCL_DANGEROUS_ALLOWED_PRIVATE_DESTINATIONS
                        value: 10.96.0.123/32:8443
                      - name: MCL_EXTERNAL_CA_FILE
                        value: /etc/mcl/git-auth/tls.crt
                    volumeMounts:
                      - name: mcl-plugin-config
                        mountPath: /home/argocd/cmp-server/config/plugin.yaml
                        subPath: plugin.yaml
                        readOnly: true
                      - name: mcl-askpass
                        mountPath: /var/run/mcl-askpass
                      - name: mcl-git-auth-tls
                        mountPath: /etc/mcl/git-auth
                        readOnly: true
          '
          kubectl rollout status -n argocd deployment/argocd-repo-server --timeout=5m
      - name: Run E2E tests
        env:
          E2E_RUN: "1"
        run: |
          set -euo pipefail
          kubectl port-forward -n argocd service/mcl-git-auth 8443:8443 > "$RUNNER_TEMP/git-port-forward.log" 2>&1 &
          port_forward_pid=$!
          trap 'kill "$port_forward_pid" 2>/dev/null || true' EXIT
          export E2E_GIT_AUTH_URL=https://mcl-git-auth.argocd.svc.cluster.local:8443
          export E2E_GIT_AUTH_ADMIN_URL=https://127.0.0.1:8443
          export E2E_GIT_AUTH_CA_FILE="$RUNNER_TEMP/git-test.crt"
          export MCL_DANGEROUS_ALLOWED_PRIVATE_DESTINATIONS=127.0.0.1/32:8443
          curl --cacert "$E2E_GIT_AUTH_CA_FILE" --retry 60 --retry-delay 2 --retry-all-errors \
            --silent --show-error --fail "$E2E_GIT_AUTH_ADMIN_URL/healthz" >/dev/null
          go test ./e2e -count=1 -timeout 20m -v
      - name: Collect cluster diagnostics
        if: ${{ failure() }}
        run: |
          go tool kind get clusters
          kubectl get pods,deployments,jobs -A -o wide || true
          kubectl get events -A --sort-by=.metadata.creationTimestamp || true
          kubectl logs -n argocd deployment/argocd-repo-server --all-containers=true --tail=200 || true
