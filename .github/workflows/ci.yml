name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.6
        with:
          install: true
          install_args: go golangci-lint
          cache: true
      - run: go test ./...
        timeout-minutes: 20
      - run: go vet ./...
      - run: golangci-lint run ./...
        timeout-minutes: 20
      - run: git diff --check
