name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.6
        with:
          install: true
          install_args: go golangci-lint
          cache: true
      - name: Get Go cache paths
        id: go-cache-paths
        run: |
          {
            echo "build=$(go env GOCACHE)"
            echo "modules=$(go env GOMODCACHE)"
            echo "version=$(go env GOVERSION)"
          } >> "$GITHUB_OUTPUT"
      - name: Cache Go build and module data
        uses: actions/cache@v6.1.0
        with:
          path: |
            ${{ steps.go-cache-paths.outputs.build }}
            ${{ steps.go-cache-paths.outputs.modules }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache-paths.outputs.version }}-${{ hashFiles('go.mod', 'go.sum', '**/*.go') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache-paths.outputs.version }}-
      - parallel:
          - name: Go tests
            timeout-minutes: 20
            run: go test ./...
          - name: golangci-lint
            timeout-minutes: 20
            run: golangci-lint run ./...
      - name: Build linux/arm64
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o "${{ runner.temp }}/mcl-argocd-arm64" ./cmd/mcl-argocd
      - run: git diff --check
