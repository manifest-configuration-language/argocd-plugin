apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
  namespace: argocd
spec:
  template:
    spec:
      containers:
        - name: mcl
          image: ghcr.io/manifest-configuration-language/argocd-plugin:v0.1.0
          imagePullPolicy: IfNotPresent
          command:
            - /var/run/argocd/argocd-cmp-server
          env:
            - name: ARGOCD_EXEC_TIMEOUT
              value: 10m
            - name: MCL_CACHE_DIRECTORY
              value: /tmp/mcl-cache
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: var-files
              mountPath: /var/run/argocd
            - name: plugins
              mountPath: /home/argocd/cmp-server/plugins
            - name: mcl-tmp
              mountPath: /tmp
      volumes:
        - name: mcl-tmp
          emptyDir:
            sizeLimit: 4Gi
