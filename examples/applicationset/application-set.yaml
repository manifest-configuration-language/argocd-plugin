apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: mcl-apps
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/manifest-configuration-language/argocd-plugin.git
        revision: main
        directories:
          - path: examples/applicationset/apps/*
  template:
    metadata:
      name: '{{path.basename}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/manifest-configuration-language/argocd-plugin.git
        targetRevision: main
        path: '{{path}}'
        plugin:
          name: mcl
      destination:
        server: https://kubernetes.default.svc
        namespace: default
