apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mcl-multi-source
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/example/platform.git
      targetRevision: main
      path: apps/example
      plugin:
        name: mcl
    - repoURL: https://github.com/example/platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: example
