apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mcl-multi-source
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/manifest-configuration-language/argocd-plugin.git
      targetRevision: main
      path: examples/multi-source
      plugin:
        name: mcl
    - repoURL: https://github.com/manifest-configuration-language/argocd-plugin.git
      targetRevision: main
      path: examples/helm/chart
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
